<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 5px;
        }

        .gender {
            display: flex;
            gap: 15px;
        }

        .gender label {
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 3px;
        }

        .success {
            color: green;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        @media(max-width:500px){
            .gender{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form id="regForm">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name">
            <div class="error" id="nameError"></div>
        </div>

        <div class="form-group">
            <label>Roll Number</label>
            <input type="text" id="roll">
            <div class="error" id="rollError"></div>
        </div>

        <div class="form-group">
            <label>Email ID</label>
            <input type="email" id="email">
            <div class="error" id="emailError"></div>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="text" id="mobile">
            <div class="error" id="mobileError"></div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
            <div class="error" id="passwordError"></div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword">
            <div class="error" id="confirmPasswordError"></div>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>
            <div class="error" id="genderError"></div>
        </div>

        <div class="form-group">
            <label>Department</label>
            <select id="department">
                <option value="">Select Department</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>MECH</option>
                <option>CIVIL</option>
            </select>
            <div class="error" id="departmentError"></div>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob">
            <div class="error" id="dobError"></div>
        </div>

        <button type="submit">Submit</button>

        <div class="success" id="successMsg"></div>

    </form>
</div>

<script>
document.getElementById("regForm").addEventListener("submit", function(e){

    e.preventDefault();

    document.querySelectorAll(".error").forEach(function(el){
        el.innerHTML = "";
    });

    document.getElementById("successMsg").innerHTML = "";

    let valid = true;

    let name = document.getElementById("name").value.trim();
    let roll = document.getElementById("roll").value.trim();
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let department = document.getElementById("department").value;
    let dob = document.getElementById("dob").value;

    let gender = document.querySelector('input[name="gender"]:checked');

    if(name==""){
        document.getElementById("nameError").innerHTML="Full Name is required";
        valid=false;
    }

    let rollPattern=/^[A-Za-z0-9]+$/;
    if(!rollPattern.test(roll)){
        document.getElementById("rollError").innerHTML="Roll Number must contain only letters and numbers";
        valid=false;
    }

    let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailPattern.test(email)){
        document.getElementById("emailError").innerHTML="Enter a valid email";
        valid=false;
    }

    let mobilePattern=/^[0-9]{10}$/;
    if(!mobilePattern.test(mobile)){
        document.getElementById("mobileError").innerHTML="Mobile Number must contain exactly 10 digits";
        valid=false;
    }

    if(password.length<8){
        document.getElementById("passwordError").innerHTML="Password must be at least 8 characters";
        valid=false;
    }

    if(password!==confirmPassword){
        document.getElementById("confirmPasswordError").innerHTML="Passwords do not match";
        valid=false;
    }

    if(!gender){
        document.getElementById("genderError").innerHTML="Please select gender";
        valid=false;
    }

    if(department==""){
        document.getElementById("departmentError").innerHTML="Please select department";
        valid=false;
    }

    if(dob==""){
        document.getElementById("dobError").innerHTML="Please select Date of Birth";
        valid=false;
    }

    if(valid){
        document.getElementById("successMsg").innerHTML="Student Registration Successful!";
        document.getElementById("regForm").reset();
    }

});
</script>

</body>
</html>
